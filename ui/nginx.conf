server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /healthz { return 200 "ok"; }
  # index.html must never be cached: it names the hashed bundles, a stale copy keeps serving the old app
  location = /index.html { add_header Cache-Control "no-cache, must-revalidate"; }
  location / { add_header Cache-Control "no-cache, must-revalidate"; try_files $uri /index.html; }
}
